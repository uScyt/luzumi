[workspace]
members = [".", "luzumi-portal"]

[package]
name = "luzumi"
version = "0.1.0"
edition = "2021"

[lib]
name = "luzumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
trash = "5"
dirs = "5"
open = "5"
base64 = "0.22"
libc = "0.2"
zip = "2"
rusqlite = { version = "0.31", features = ["bundled"] }

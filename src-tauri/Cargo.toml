[workspace]
members = [".", "luzumi-portal"]

[package]
name = "luzumi"
version = "0.2.0"
edition = "2021"

[lib]
name = "luzumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
trash = "5"
dirs = "5"
open = "5"
base64 = "0.22"
libc = "0.2"
zip = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
md5 = "0.7"
sha2 = "0.10"
notify = { version = "7", default-features = true }
percent-encoding = "2"
strsim = "0.11"
memmap2 = "0.9"
lru = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = "0.4"
lazy_static = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
tar = "0.4"
zeroize = "1"

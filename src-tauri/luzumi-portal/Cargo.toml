[package]
name = "luzumi-portal"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "luzumi-portal"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
notify = "7"
dirs = "5"
